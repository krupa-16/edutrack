<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | EduTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex align-items-center min-vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6 col-lg-5">
                
                <div class="text-center mb-4">
                    <img src="https://img.freepik.com/premium-vector/hand-drawn-icon-education_755164-26813.jpg?semt=ais_hybrid&w=740&q=80" 
                         alt="EduTrack Logo" class="auth-logo shadow-sm mb-3">
                    <h2 class="fw-bold">Join EduTrack</h2>
                    <p class="text-muted">Start tracking your academic progress today</p>
                </div>

                <div class="card auth-card p-4 p-md-5">
                    <form id="registerForm">
                        <div class="row g-3 mb-3">
                            <div class="col-12">
                                <label class="form-label small fw-semibold">Full Name</label>
                               <input type="text" id="username" class="form-control" placeholder="Alex Smith" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Email Address</label>
                            <input type="email" id="email" class="form-control" placeholder="alex@university.edu" required>
                        </div>
                        <div class="mb-3">
                            
    <label class="form-label small fw-semibold">Create Password</label>
    <div class="input-group">
        <input type="password" id="regPasswordInput" class="form-control border-end-0" placeholder="Min. 8 characters" required>
        <button class="btn border border-start-0 bg-white" type="button" id="toggleRegPassword">
            <i data-lucide="eye" id="eyeRegIcon" class="size-18 text-muted"></i>
        </button>
    </div>
</div>
                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" id="terms" required>
                            <label class="form-check-label small text-muted" for="terms">
                                I agree to the <a href="#" class="text-decoration-none">Terms of Service</a>
                            </label>
                        </div>
                        <button type="submit" class="btn btn-auth w-100 mb-3">Create Account</button>
                    </form>
                    
                    <div class="text-center">
                        <p class="small text-muted mb-0">Already using EduTrack? 
                            <a href="login.html" class="fw-bold text-primary text-decoration-none">Sign In</a>
                        </p>
                    </div>
                </div>

            </div>
        </div>
    </div>
    <script>
document.addEventListener('DOMContentLoaded', () => {
    // 1. Initialize Icons
    lucide.createIcons();

    // 2. Setup Toggle Functionality
    setupPasswordToggle('togglePassword', 'passwordInput', 'eyeIcon'); // For Login
    setupPasswordToggle('toggleRegPassword', 'regPasswordInput', 'eyeRegIcon'); // For Register
});

function setupPasswordToggle(buttonId, inputId, iconId) {
    const toggleBtn = document.getElementById(buttonId);
    if (!toggleBtn) return;

    const passwordInput = document.getElementById(inputId);
    const eyeIcon = document.getElementById(iconId);

    toggleBtn.addEventListener('click', () => {
        // Toggle the type attribute
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);

        // Update the icon name
        const iconName = type === 'password' ? 'eye' : 'eye-off';
        eyeIcon.setAttribute('data-lucide', iconName);
        
        // Re-render the specific icon
        lucide.createIcons(); 
    });
}
</script>
<script src="js/auth.js"></script>
<script>
    // Just tell the form to use the function in auth.js
    document.getElementById('registerForm').addEventListener('submit', registerUser);
</script>
<script src="js/config.js"></script>
</body>
</html>
