<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | EduTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="d-flex align-items-center min-vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6 col-lg-4">
                
                <div class="text-center mb-4">
                    <img src="https://img.freepik.com/premium-vector/hand-drawn-icon-education_755164-26813.jpg?semt=ais_hybrid&w=740&q=80" 
                         alt="EduTrack Logo" class="auth-logo shadow-sm mb-3">
                    <h2 class="fw-bold">Welcome Back</h2>
                    <p class="text-muted">Sign in to manage your attendance</p>
                </div>

                <div class="card auth-card p-4">
                   <form id="loginForm" onsubmit="loginUser(event)">
    
    <div class="mb-3">
        <label class="form-label small fw-semibold">Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="alex@university.edu" required>
    </div>

    <div class="mb-4">
        <div class="d-flex justify-content-between">
            <label class="form-label small fw-semibold">Password</label>
            <a href="forgotpassword.html" class="small text-decoration-none">Forgot?</a>
        </div>
        <div class="input-group">
            <input type="password" id="password" class="form-control border-end-0" placeholder="••••••••" required>
            <button class="btn border border-start-0 bg-white" type="button" id="togglePassword">
                <i data-lucide="eye" id="eyeIcon" style="width: 18px; height: 18px;" class="text-muted"></i>
            </button>
        </div>
    </div>

    <button type="submit" class="btn btn-auth w-100 mb-3">Login</button>

</form> 




                    
                    <div class="text-center">
                        <p class="small text-muted mb-0">Don't have an account? 
                            <a href="register.html" class="fw-bold text-primary text-decoration-none">Create one</a>
                        </p>
                    </div>
                </div>

            </div>
        </div>
    </div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Initialize Icons
        lucide.createIcons();

        // Setup Toggle Functionality
        const toggleBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('passwordInput');
        const eyeIcon = document.getElementById('eyeIcon');

        toggleBtn.addEventListener('click', () => {
            // Toggle the type attribute
            const isPassword = passwordInput.getAttribute('type') === 'password';
            passwordInput.setAttribute('type', isPassword ? 'text' : 'password');

            // Update the icon
            eyeIcon.setAttribute('data-lucide', isPassword ? 'eye-off' : 'eye');
            
            // Re-render the icons to reflect the change
            lucide.createIcons(); 
        });
    });
</script>
<script src="js/auth.js"></script>
<script>
    document.getElementById('loginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        
        const email = document.querySelector('input[type="email"]').value;
        const password = document.getElementById('passwordInput').value;

        const result = loginUser(email, password);

        if (result.success) {
            window.location.href = 'dashboard.html'; // Go to dashboard
        } else {
            // Optional: Add a shake effect or error text
            alert(result.message);
        }
    });
</script>
<script src="js/config.js"></script>

</body>
</html>
