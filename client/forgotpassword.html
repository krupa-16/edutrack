<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | EduTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="d-flex align-items-center min-vh-100 bg-light">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6 col-lg-4">
                
                <div class="text-center mb-4">
                    <img src="https://img.freepik.com/premium-vector/hand-drawn-icon-education_755164-26813.jpg?semt=ais_hybrid&w=740&q=80" 
                         alt="EduTrack Logo" class="auth-logo shadow-sm mb-3" style="width: 64px; border-radius: 12px;">
                    <h2 class="fw-bold">Reset Password</h2>
                    <p class="text-muted">Enter your email and we'll send you a link to get back into your account.</p>
                </div>

                <div class="card auth-card p-4 border-0 shadow-sm" style="border-radius: 20px;">
                    <form id="forgotPasswordForm">
                        <div class="mb-4">
                            <label class="form-label small fw-semibold">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0">
                                    <i data-lucide="mail" class="text-muted" style="width: 18px;"></i>
                                </span>
                                <input type="email" id="emailInput" class="form-control border-start-0 ps-0" 
                                       placeholder="alex@university.edu" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mb-3" style="background-color: #4f46e5; border: none; border-radius: 10px;">
                            Send Reset Link
                        </button>
                    </form>

                    <div id="successMessage" class="text-center d-none">
                        <div class="p-3 mb-3 bg-success-subtle text-success rounded-3 small">
                            <i data-lucide="check-circle" class="me-1" style="width: 16px;"></i>
                            Reset link has been sent! Please check your inbox.
                        </div>
                    </div>
                    
                    <div class="text-center mt-2">
                        <a href="login.html" class="small text-primary fw-bold text-decoration-none d-flex align-items-center justify-content-center">
                            <i data-lucide="arrow-left" class="me-1" style="width: 14px;"></i>
                            Back to Login
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Initialize Icons
        lucide.createIcons();

        const form = document.getElementById('forgotPasswordForm');
        const successMessage = document.getElementById('successMessage');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            // Logic for Express Backend would go here
            // For now, we simulate a successful email send:
            
            form.classList.add('d-none'); // Hide the form
            successMessage.classList.remove('d-none'); // Show success alert
            
            console.log("Reset link requested for:", document.getElementById('emailInput').value);
        });
    });
</script>
<script src="js/config.js"></script>

</body>
</html>
