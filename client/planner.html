<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduTrack | Unified Dashboard</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            --high: #ef4444; --medium: #3b82f6; --low: #10b981;
            --primary: #1a73e8; --bg-body: #f8fafc;
            --planner-green: #10b981;
            --planner-bg: #e6f4ea;
        }

        body { background-color: var(--bg-body); font-family: 'Inter', sans-serif; overflow-x: hidden; }

        /* --- NAVBAR: Logo & Right-Aligned Links --- */
        .navbar { background: white; padding: 0.6rem 2rem; border-bottom: 1px solid #edf2f7; }
        .navbar-brand img { height: 40px; width: auto; object-fit: contain; }
        .brand-text { font-weight: 700; font-size: 1.4rem; color: #1e293b; margin-left: 8px; }
        
        .navbar-nav-custom { display: flex; align-items: center; gap: 10px; margin-left: auto; }
        .nav-link-custom {
            color: #5f6368; font-weight: 600; padding: 8px 22px; 
            border-radius: 50px; text-decoration: none; transition: 0.3s;
            border: 2px solid transparent;
        }
        
        /* Planner Highlight */
        .nav-link-custom.active { 
            background-color: var(--planner-bg); 
            color: var(--planner-green); 
            border-color: var(--planner-green); 
        }

        /* --- COMMAND CENTER & SEARCH --- */
        .command-card { background: white; border-radius: 20px; border: 1px solid rgba(0,0,0,0.05) !important; box-shadow: 0 2px 15px rgba(0,0,0,0.03); }
        .search-wrapper { position: relative; display: flex; align-items: center; }
        .expanding-search {
            width: 180px; height: 46px; padding-left: 45px; border-radius: 12px;
            border: 1px solid #e2e8f0; background-color: #f8fafc; transition: width 0.4s;
        }
        .expanding-search:focus { width: 300px; background-color: white; border-color: var(--primary); outline: none; }
        .search-icon { position: absolute; left: 15px; color: #94a3b8; width: 18px; pointer-events: none; z-index: 10; }

        /* --- DASHBOARD COLUMNS --- */
        .glass-column { border-radius: 24px; padding: 25px; min-height: 80vh; background: white; border: 1px solid rgba(0,0,0,0.05); }
        .col-workload { background: #f0f7ff; }
        .col-exams { background: #fff5f5; }

        /* --- CARDS & PRIORITIES --- */
        .expandable-card { border-radius: 16px; border: none; background: white; box-shadow: 0 4px 6px rgba(0,0,0,0.02); overflow: hidden; margin-bottom: 12px; }
        .p-high { border-left: 5px solid var(--high); }
        .p-medium { border-left: 5px solid var(--medium); }
        .p-low { border-left: 5px solid var(--low); }

        /* --- POMODORO TIMER --- */
        .timer-circle {
            width: 170px; height: 170px; border: 8px solid #e2e8f0;
            border-radius: 50%; display: flex; flex-direction: column;
            align-items: center; justify-content: center; margin: 0 auto;
            transition: 0.4s;
        }
        .timer-circle.active { border-color: var(--planner-green); box-shadow: 0 0 20px rgba(16, 185, 129, 0.15); }

        /* --- TOASTS --- */
        #toastContainer { position: fixed; bottom: 20px; right: 20px; z-index: 9999; }
        .custom-toast { background: white; padding: 15px 25px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); margin-top: 10px; transition: 0.5s; }
        @media (max-width: 991.98px) {
    .navbar-collapse {
        background: #fdfdfd;
        padding: 1.5rem;
        border-radius: 1.5rem;
        margin-top: 1rem;
        box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        border: 1px solid #eee;
    }
    
    .navbar-collapse .btn {
        width: 100%; /* Makes buttons full-width on mobile for easier tapping */
        text-align: center;
        margin-bottom: 0.5rem;
    }
}
    </style>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="toastContainer"></div>

   <nav class="navbar navbar-expand-lg sticky-top bg-white border-bottom py-2">
    <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center" href="dashboard.html">
            <img src="https://img.freepik.com/premium-vector/hand-drawn-icon-education_755164-26813.jpg?semt=ais_hybrid&w=740&q=80" 
                 alt="EduTrack Logo" width="35" class="me-2">
            <span class="brand-text fw-bold text-primary">EduTrack</span>
        </a>
        
        <button class="navbar-toggler border-0 shadow-none" type="button" 
                data-bs-toggle="collapse" data-bs-target="#eduNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="eduNav">
            <div class="navbar-nav ms-auto gap-2 mt-3 mt-lg-0">
                <a href="dashboard.html" class="nav-link-custom px-3 py-2 text-center">Overview</a>
                <a href="attendance.html" class="nav-link-custom px-3 py-2 text-center">Attendance</a>
                <a href="planner.html" class="nav-link-custom px-3 py-2 text-center active">Planner</a>
            </div>
        </div>
    </div>
</nav>

    <main class="container-fluid py-4 px-lg-5">
        
        <div class="card command-card mb-4 border-0">
            <div class="card-body p-4 d-flex flex-column flex-md-row justify-content-between align-items-center gap-3">
                <div>
                    <h3 class="fw-bold mb-1">Command Center</h3>
                    <p class="text-muted small mb-0">Search and organize your academic workflow.</p>
                </div>

                <div class="d-flex align-items-center gap-3">
                    <div class="search-wrapper">
                        <i data-lucide="search" class="search-icon"></i>
                        <input type="text" id="mainSearch" class="expanding-search" placeholder="Search entries..." oninput="handleSearch()">
                    </div>

                    <div class="dropdown">
                        <button class="btn btn-primary px-4 py-2 rounded-3 fw-bold d-flex align-items-center gap-2" data-bs-toggle="dropdown">
                            <i data-lucide="plus" style="width: 20px;"></i>
                            <span>Create</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end border-0 shadow-lg p-2 rounded-4 mt-2">
                            <li><a class="dropdown-item fw-bold py-2" href="javascript:void(0)" onclick="openModal('task')">New Task</a></li>
                            <li><a class="dropdown-item fw-bold py-2" href="javascript:void(0)" onclick="openModal('assignment')">New Assignment</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item fw-bold text-danger py-2" href="javascript:void(0)" onclick="openExamModal()">Upcoming Exam</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-xl-4 col-md-6">
                <div class="glass-column col-workload">
                    <h5 class="fw-bold mb-4">Daily Workload</h5>
                    <div id="activeTasks"></div>
                    <div id="completedTasks" class="mt-4 pt-3 border-top border-white"></div>
                </div>
            </div>

            <div class="col-xl-4 col-md-6">
                <div class="glass-column col-exams">
                    <h5 class="fw-bold mb-4 text-danger d-flex align-items-center gap-2">
                        <i data-lucide="shield-alert"></i> Exam Portal
                    </h5>
                    <div id="examList"></div>
                </div>
            </div>

            <div class="col-xl-4">
                <div class="glass-column">
                    <h5 class="fw-bold mb-4">Focus & Intelligence</h5>
                    <div id="intelFeed" class="mb-4"></div>

                    <div class="card border-0 shadow-sm p-4 text-center rounded-5 bg-light">
                        <div class="timer-circle mb-3" id="timerRing">
                            <h1 class="display-5 fw-bold mb-0" id="timer">25:00</h1>
                            <small class="text-muted fw-bold">FOCUS</small>
                        </div>
                        <div class="d-flex justify-content-center gap-2 mb-4">
                            <button class="btn btn-sm btn-outline-secondary rounded-pill px-3" onclick="setTimer(25)">25m</button>
                            <button class="btn btn-sm btn-outline-secondary rounded-pill px-3" onclick="setTimer(5)">5m</button>
                        </div>
                        <button class="btn btn-dark w-100 rounded-pill py-3 fw-bold" onclick="toggleTimer()" id="timerBtn">START SESSION</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div class="modal fade" id="entryModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg rounded-5 p-3">
                <div class="modal-header border-0 pb-0">
                    <h4 class="fw-bold mb-0" id="modalHeading">Add Entry</h4>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="entryType">
                    <div class="mb-3">
                        <label class="small fw-bold text-muted">TITLE</label>
                        <input type="text" id="entryTitle" class="form-control rounded-3" placeholder="Enter title...">
                    </div>
                    <div class="row">
                        <div class="col-6 mb-3">
                            <label class="small fw-bold text-muted">PRIORITY</label>
                            <select id="entryPriority" class="form-select rounded-3">
                                <option value="high">High</option>
                                <option value="medium" selected>Medium</option>
                                <option value="low">Low</option>
                            </select>
                        </div>
                        <div class="col-6 mb-3">
                            <label class="small fw-bold text-muted">DUE DATE</label>
                            <input type="date" id="entryDate" class="form-control rounded-3">
                        </div>
                    </div>
                    <button class="btn btn-primary w-100 py-3 rounded-pill fw-bold" onclick="saveEntry()">Save Entry</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="examModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg rounded-5 p-3">
                <div class="modal-header border-0 pb-0">
                    <h4 class="fw-bold text-danger mb-0">New Exam Schedule</h4>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="small fw-bold text-muted">SUBJECT</label>
                        <input type="text" id="examTitle" class="form-control rounded-3" placeholder="e.g. Mathematics Midterm">
                    </div>
                    <div class="mb-3">
                        <label class="small fw-bold text-muted">EXAM DATE</label>
                        <input type="date" id="examDate" class="form-control rounded-3">
                    </div>
                    <div class="mb-3">
                        <label class="small fw-bold text-muted d-flex justify-content-between">
                            STUDY CHECKLIST <span class="text-primary" style="cursor:pointer" onclick="addSubTask()">+ Add</span>
                        </label>
                        <div id="subTaskContainer" class="mt-2"></div>
                    </div>
                    <button class="btn btn-danger w-100 py-3 rounded-pill fw-bold" onclick="saveExam()">Activate Exam Schedule</button>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="deleteConfirmModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content border-0 shadow-lg" style="border-radius: 32px;">
            <div class="modal-body text-center p-4">
                <div class="mx-auto mb-3 d-flex align-items-center justify-content-center" 
                     style="width: 80px; height: 80px; background: #fff1f2; border-radius: 50%;">
                    <i data-lucide="trash-2" class="text-danger" style="width: 32px; height: 32px;"></i>
                </div>

                <h4 class="fw-bold mb-2">Remove Subject?</h4>
                <p class="text-muted small mb-4">All records will be lost.</p>

                <div class="d-grid gap-2">
                    <button type="button" id="confirmDeleteBtn" class="btn btn-danger py-3 fw-bold shadow-sm" 
                            style="border-radius: 30px; background-color: #e11d48; border: none;">
                        Delete Anyway
                    </button>
                    <button type="button" class="btn btn-light py-3 fw-bold text-dark" 
                            style="border-radius: 30px; background: #f8fafc;" data-bs-dismiss="modal">
                        Go Back
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/planner.js"></script>
    <script>lucide.createIcons();</script>
    <script src="js/config.js"></script>
    
</body>
</html>
