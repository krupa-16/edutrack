<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduTrack Final Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root { --primary: #4f46e5; --workload: #f0f7ff; --exams: #fff5f5; }
        body { background: #f8fafc; font-family: 'Segoe UI', sans-serif; }
        .glass-column { border-radius: 25px; padding: 25px; min-height: 80vh; border: 1px solid rgba(0,0,0,0.05); shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .column-workload { background-color: var(--workload); }
        .column-exams { background-color: var(--exams); }
        .expandable-card { border-radius: 15px !important; transition: transform 0.2s; cursor: pointer; border: none !important; margin-bottom: 15px; }
        .expandable-card:hover { transform: translateY(-3px); box-shadow: 0 10px 15px rgba(0,0,0,0.05) !important; }
        .priority-high { border-left: 6px solid #ef4444 !important; }
        .priority-medium { border-left: 6px solid #f59e0b !important; }
        .priority-low { border-left: 6px solid #10b981 !important; }
        .task-container { min-height: 200px; }
    </style>
</head>
<body>

    <main class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-5 bg-white p-4 rounded-4 shadow-sm">
            <h2 class="fw-bold mb-0">EduTrack Command Center</h2>
            <div class="dropdown">
                <button class="btn btn-primary btn-lg rounded-pill dropdown-toggle" data-bs-toggle="dropdown">
                    + Create New
                </button>
                <ul class="dropdown-menu dropdown-menu-end shadow border-0">
                    <li><a class="dropdown-item fw-bold" href="javascript:void(0)" onclick="openEntryModal('task')">New Task</a></li>
                    <li><a class="dropdown-item fw-bold" href="javascript:void(0)" onclick="openEntryModal('assignment')">New Assignment</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item fw-bold text-danger" href="javascript:void(0)" onclick="openExamModal()">Upcoming Exam</a></li>
                </ul>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-md-6">
                <div class="glass-column column-workload">
                    <h5 class="fw-bold text-primary mb-4">Workload (Tasks & Assignments)</h5>
                    <div id="workloadList" class="task-container"></div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="glass-column column-exams">
                    <h5 class="fw-bold text-danger mb-4">Exam Portal</h5>
                    <div id="examList" class="task-container"></div>
                </div>
            </div>
        </div>
    </main>

    <div class="modal fade" id="entryModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow rounded-4 p-3">
                <h5 class="fw-bold mb-3" id="modalHeading">New Entry</h5>
                <input type="hidden" id="entryType">
                <div class="mb-3">
                    <label class="small fw-bold">SUBJECT</label>
                    <input type="text" id="entrySubject" class="form-control" placeholder="Math, Science, etc.">
                </div>
                <div class="mb-3">
                    <label class="small fw-bold">TITLE</label>
                    <input type="text" id="entryTitle" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="small fw-bold">PRIORITY</label>
                    <select id="entryPriority" class="form-select">
                        <option value="high">High</option>
                        <option value="medium" selected>Medium</option>
                        <option value="low">Low</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="small fw-bold">DUE DATE</label>
                    <input type="date" id="entryDate" class="form-control">
                </div>
                <button class="btn btn-primary w-100 rounded-pill py-2 fw-bold" onclick="saveEntry()">Save Entry</button>
            </div>
        </div>
    </div>

    <div class="modal fade" id="examModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow rounded-4 p-4">
                <h5 class="fw-bold text-danger mb-3">Setup Exam</h5>
                <div class="mb-3"><label class="small fw-bold">EXAM TITLE</label><input type="text" id="examTitle" class="form-control"></div>
                <div class="mb-3"><label class="small fw-bold">DATE</label><input type="date" id="examDate" class="form-control"></div>
                <div class="bg-light p-3 rounded-3 mb-3">
                    <label class="small fw-bold mb-2">PREP TASKS (N No. of Tasks)</label>
                    <div id="subTaskContainer"></div>
                    <button class="btn btn-sm btn-outline-primary mt-2" onclick="addSubTaskInput()">+ Add Step</button>
                </div>
                <button class="btn btn-danger w-100 rounded-pill py-2 fw-bold" onclick="saveExam()">Add Exam</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let db = JSON.parse(localStorage.getItem('eduTrack_DB')) || { entries: [] };
        
        function openEntryModal(type) {
            document.getElementById('entryType').value = type;
            document.getElementById('modalHeading').innerText = "Add " + type.toUpperCase();
            new bootstrap.Modal(document.getElementById('entryModal')).show();
        }

        function openExamModal() {
            document.getElementById('subTaskContainer').innerHTML = '';
            addSubTaskInput();
            new bootstrap.Modal(document.getElementById('examModal')).show();
        }

        function addSubTaskInput() {
            const div = document.createElement('div');
            div.className = "input-group mb-1";
            div.innerHTML = `<input type="text" class="form-control sub-input" placeholder="Task..."><button class="btn btn-outline-danger" onclick="this.parentElement.remove()">×</button>`;
            document.getElementById('subTaskContainer').appendChild(div);
        }

        function saveEntry() {
            const entry = {
                id: Date.now(),
                type: document.getElementById('entryType').value,
                title: document.getElementById('entryTitle').value,
                subject: document.getElementById('entrySubject').value,
                priority: document.getElementById('entryPriority').value,
                date: document.getElementById('entryDate').value,
                status: 'pending'
            };
            if(!entry.title || !entry.subject) return alert("Fill all fields");
            db.entries.push(entry);
            refresh();
            bootstrap.Modal.getInstance(document.getElementById('entryModal')).hide();
        }

        function saveExam() {
            const subTasks = Array.from(document.querySelectorAll('.sub-input')).map(i => ({ title: i.value, done: false })).filter(t => t.title);
            db.entries.push({
                id: Date.now(),
                type: 'exam',
                title: document.getElementById('examTitle').value,
                date: document.getElementById('examDate').value,
                subtasks: subTasks,
                priority: 'high',
                status: 'pending'
            });
            refresh();
            bootstrap.Modal.getInstance(document.getElementById('examModal')).hide();
        }

        function refresh() {
            localStorage.setItem('eduTrack_DB', JSON.stringify(db));
            const wList = document.getElementById('workloadList');
            const eList = document.getElementById('examList');
            wList.innerHTML = ''; eList.innerHTML = '';

            db.entries.forEach(e => {
                const card = `
                <div class="card expandable-card bg-white p-3 shadow-sm priority-${e.priority}">
                    <div onclick="document.getElementById('body-${e.id}').classList.toggle('d-none')">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <small class="text-uppercase fw-bold text-muted" style="font-size:10px">${e.type}</small>
                                <h6 class="fw-bold mb-0">${e.title}</h6>
                            </div>
                            <span class="badge rounded-pill ${e.status === 'completed' ? 'bg-success' : 'bg-warning text-dark'}">${e.status}</span>
                        </div>
                    </div>
                    <div id="body-${e.id}" class="d-none mt-3">
                        <hr>
                        ${e.subtasks ? e.subtasks.map((s, i) => `
                            <div class="form-check small">
                                <input class="form-check-input" type="checkbox" ${s.done ? 'checked' : ''} onchange="toggleSub(${e.id}, ${i})">
                                <label class="${s.done ? 'text-decoration-line-through text-muted' : ''}">${s.title}</label>
                            </div>
                        `).join('') : ''}
                        <div class="d-flex justify-content-between mt-3">
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteItem(${e.id})">Delete</button>
                            <button class="btn btn-sm btn-success rounded-pill" onclick="toggleStatus(${e.id})">Complete</button>
                        </div>
                    </div>
                </div>`;
                if(e.type === 'exam') eList.innerHTML += card;
                else wList.innerHTML += card;
            });
        }

        function deleteItem(id) { db.entries = db.entries.filter(e => e.id !== id); refresh(); }
        function toggleStatus(id) { 
            const item = db.entries.find(e => e.id === id); 
            item.status = (item.status === 'pending' ? 'completed' : 'pending'); 
            refresh(); 
        }
        function toggleSub(eid, si) {
            const exam = db.entries.find(e => e.id === eid);
            exam.subtasks[si].done = !exam.subtasks[si].done;
            refresh();
        }

        window.onload = refresh;
    </script>
</body>
</html>
