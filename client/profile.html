<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Profile | EduTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg py-3 bg-white border-bottom mb-5">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="dashboard.html">EduTrack Profile</a>
            <a href="dashboard.html" class="btn btn-outline-primary rounded-pill">Back to Dashboard</a>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card p-4 border-0 shadow-sm" style="border-radius: 24px;">
                    <h4 class="fw-bold mb-4">Account Settings</h4>
                    
                    <form id="profileForm">
                        <div class="text-center mb-4">
                            <img src="" id="formAvatar" class="rounded-circle mb-2" width="100">
                            <div><button type="button" class="btn btn-sm btn-link">Change Avatar</button></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-bold">Full Name</label>
                            <input type="text" id="editName" class="form-control" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-bold">Email Address</label>
                            <input type="email" id="editEmail" class="form-control" readonly style="background: #f8f9fa;">
                            <small class="text-muted">Email cannot be changed for security.</small>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary py-2 fw-bold rounded-3">Update Profile</button>
                            <button type="button" onclick="logout()" class="btn btn-outline-danger py-2 fw-bold rounded-3">Logout</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = JSON.parse(localStorage.getItem('eduTrack_currentUser'));
            if (!user) window.location.href = 'login.html';

            // Fill Form
            document.getElementById('editName').value = user.name;
            document.getElementById('editEmail').value = user.email;
            document.getElementById('formAvatar').src = `https://ui-avatars.com/api/?name=${user.name}&background=4f46e5&color=fff`;

            // Handle Update
            document.getElementById('profileForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const newName = document.getElementById('editName').value;
                
                // 1. Update current session
                user.name = newName;
                localStorage.setItem('eduTrack_currentUser', JSON.stringify(user));

                // 2. Update in user database
                const users = JSON.parse(localStorage.getItem('eduTrack_users')) || [];
                const userIndex = users.findIndex(u => u.email === user.email);
                if (userIndex !== -1) {
                    users[userIndex].name = newName;
                    localStorage.setItem('eduTrack_users', JSON.stringify(users));
                }

                alert("Profile Updated Successfully!");
                location.reload();
            });
        });
    </script>
    <script src="js/config.js"></script>
</body>
</html>
